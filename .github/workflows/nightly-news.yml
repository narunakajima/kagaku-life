# 毎晩、ニュース起点のネタ候補（ベスト3の下書き）を集めて Slack に送る（2026-10-14）。
# 収集〜注目度の実測までは Python だけで動かし、Claude は使わない。
# 既視感・競合動画・ジャンルの間隔などの仕上げは、朝の /kl-new で行う。
#
# 必要な Secrets（値はチャット・ファイルに書かない。gh secret set で登録）:
#   GEMINI_API_KEY_KL    … Gemini の API キー
#   SLACK_WEBHOOK_URL_KL … Slack の Incoming Webhook URL（KL News アプリ）
# 手順: collect → score → verify（一次資料URLの実在確認、2026-10-15）→ repair（404のURLの自動修復、2026-10-15）→ tag → enrich → buzz → list。
# verify・repair は Secrets 不要（HTTPのみ）
name: nightly-news

on:
  schedule:
    - cron: "17 17 * * *"   # 毎日 02:17 JST（毎時0分の混雑を避けて分をずらす。実測で2〜4時間遅れて起動するため前倒し）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: nightly-news
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      GEMINI_API_KEY_KL: ${{ secrets.GEMINI_API_KEY_KL }}
      SLACK_WEBHOOK_URL_KL: ${{ secrets.SLACK_WEBHOOK_URL_KL }}
      YOUTUBE_API_KEY_KL: ${{ secrets.YOUTUBE_API_KEY_KL }}   # 未設定なら空。YouTube の英日の差は測らない（従来どおり）
      TZ: Asia/Tokyo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install google-genai

      - name: Scan news
        run: |
          set -o pipefail
          # gemini_trending（日本語圏の話題の補完検索）は週1回、JST の月曜（月曜 02:17 JST 起動分）だけ実行（2026-11-13、削減プラン項目F）。
          # 他の曜日は --no-trending（分野の絞り込みと RSS 等の収集は毎晩そのまま）。TZ=Asia/Tokyo なので date は JST
          TREND_OPT="--no-trending"
          [ "$(date +%u)" = "1" ] && TREND_OPT=""
          python3 kl_news_scan.py collect --days 21 $TREND_OPT
          python3 kl_news_scan.py score --top 30 || STALL=1   # 0件採点は非0終了。後の工程・コミットは続け、最後に失敗にする（2026-11-09）
          # 一次資料URLの実在確認（2026-10-15、NEWS_REDESIGN_2026-10-15.md §3.5。HTTPだけで Gemini 不要）。
          # 全URLが404の候補はゲートで落ち、後の enrich・buzz の対象にもならない。失敗しても後の工程は止めない
          python3 kl_news_scan.py verify --max 60 || echo "verify に失敗（続行）"
          # 404の一次資料の正しいURLを、発表元サイト・プールの公式記事・報道記事のリンクから探す（HTTPのみ、Gemini 不要。
          # 1候補あたり1分前後、全体で最大5分。前回の試行から7日以内の候補は飛ばす）。見つかれば primary_verified が true に戻る
          python3 kl_news_scan.py repair --max 12 || echo "repair に失敗（続行）"
          python3 kl_news_scan.py tag
          python3 kl_news_scan.py enrich || STALL=1
          python3 kl_news_scan.py buzz
          # 同一ネタの繰り返し対策（2026-11-08）: 2日提示して選ばれなかった候補の棚上げ・同一ストーリーの重複統合（費用ゼロ、データは消さない）
          python3 kl_news_scan.py dedupe || echo "dedupe に失敗（続行）"
          python3 kl_news_scan.py list --top 10 --check-urls > nightly_list.txt
          python3 kl_concern_select.py > nightly_concern.txt || true
          if [ -n "$STALL" ]; then echo "採点・付与が止まっています（nightly_stall.txt）"; exit 1; fi

      - name: Commit news_candidates.json
        if: always()   # 採点が止まって Scan news が失敗しても、途中までのデータは残す（2026-11-09）
        run: |
          git config user.name "kl-nightly-bot"
          git config user.email "kl-nightly-bot@users.noreply.github.com"
          git add news_candidates.json
          git add news_prefilter_log.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: 夜間ニュース採点を更新 [skip ci]"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git pull --rebase
            done
          fi

      - name: Post to Slack
        if: always()
        run: |
          if [ -z "$SLACK_WEBHOOK_URL_KL" ]; then echo "Webhook 未設定"; exit 0; fi
          if python3 kl_news_scan.py slack --note nightly_concern.txt > slack_payload.json; then
            :
          else
            jq -n '{text: "KL ネタ ベスト3: 整形に失敗しました。Actions のログを確認してください。"}' > slack_payload.json
          fi
          curl -sS -X POST -H 'Content-type: application/json' --data @slack_payload.json "$SLACK_WEBHOOK_URL_KL"
          if [ -s nightly_stall.txt ]; then
            jq -n --rawfile m nightly_stall.txt '{text: ("🚨 KL ニュース: " + $m + "Actions のログ（Scan news）を確認してください。")}' > stall_payload.json
            curl -sS -X POST -H 'Content-type: application/json' --data @stall_payload.json "$SLACK_WEBHOOK_URL_KL"
          fi
          # Gemini モデルの自動フォールバック通知（2026-11-09 指示024。kl_gemini_model.py が model_fallback.txt に書く）
          if [ -s model_fallback.txt ]; then
            jq -n --rawfile m model_fallback.txt '{text: ("⚠️ KL ニュース: " + $m + "（モデル名の見直しが必要です）")}' > model_payload.json
            curl -sS -X POST -H 'Content-type: application/json' --data @model_payload.json "$SLACK_WEBHOOK_URL_KL"
          fi

      # 下書きに載せた日（presented_on）を残す（2026-11-08）。slack コマンドが news_candidates.json に書く
      - name: Commit presented_on
        if: always()
        run: |
          git config user.name "kl-nightly-bot"
          git config user.email "kl-nightly-bot@users.noreply.github.com"
          git add news_candidates.json
          git add news_prefilter_log.json 2>/dev/null || true   # 予備採点で落とした候補の記録（2026-11-13、指示 2026-11-13-002）
          git add series_trace.json 2>/dev/null || true   # シリーズ候補の進み具合の日次記録（2026-11-10、指示 2026-11-10-015）
          if git diff --cached --quiet; then
            echo "変更なし"
          else
            git commit -m "data: 下書きの提示履歴を更新 [skip ci]"
            for attempt in 1 2 3; do
              if git push; then break; fi
              git pull --rebase
            done
          fi
